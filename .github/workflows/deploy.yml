name: Deploy to AWS

# Builds the site and deploys it to the AWS server on every merge/push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two production deploys at once; let an in-flight deploy finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package build output
        run: tar -czf dist.tar.gz -C dist .

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: dist.tar.gz
          target: /home/aikonx/tmp

      - name: Extract and publish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            DOCROOT="/home/aikonx/public_html"
            mkdir -p "$DOCROOT"
            # Remove previous hashed JS/CSS bundles so they don't pile up.
            # Media (images/models/videos) and the Google verification file are left untouched.
            rm -f "$DOCROOT"/assets/index-*.js "$DOCROOT"/assets/index-*.css
            # Overlay the new build on top of the web root (does NOT delete the
            # Google Search Console verification file or other server-only files).
            tar -xzf /home/aikonx/tmp/dist.tar.gz -C "$DOCROOT"
            rm -f /home/aikonx/tmp/dist.tar.gz
            echo "Deploy complete: $(date)"

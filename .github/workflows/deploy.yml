name: Inspect tracking backend capabilities
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect website runtime without changing it
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            echo 'PHP runtime availability:'
            command -v php || true
            if command -v php >/dev/null 2>&1; then
              php -r 'echo "Version=".PHP_VERSION.PHP_EOL;foreach(["curl","openssl","json","filter"] as $ext){echo $ext."=".(extension_loaded($ext)?"yes":"no").PHP_EOL;} echo "mail=".(function_exists("mail")?"yes":"no").PHP_EOL;echo "sendmail=".ini_get("sendmail_path").PHP_EOL;'
            fi
            echo 'Existing public PHP handlers:'
            find /home/aikonx/public_html -maxdepth 1 -type f -name '*.php' -printf '%f\n'
            echo 'Mail transport executable:'
            command -v sendmail || true
            test ! -d /home/aikonx/.dapem || echo 'Private Dapem config directory exists'
